<!DOCTYPE html>
<html>
<head>
    <title>Calendar</title>
    <link rel="stylesheet" href="calendar.css">
</head>

<body>

    <h1>Monthly Calendar</h1>

    <h2 id="month_year"></h2>

    <table id="calendar">
        <tr>
            <th>Sun</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
        </tr>

        <tbody id="calendar_body">
            <!-- JavaScript will add calendar dates here -->
        </tbody>

    </table>


    <script src="calendar.js"></script>

</body>
</html>
